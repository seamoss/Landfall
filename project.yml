# Mac App Store edition of Landfall. Generate with ./scripts/mas.sh (the .xcodeproj is not committed).
# The GitHub/Developer ID edition is built by SwiftPM (scripts/package.sh); both share every source file.
name: Landfall
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Landfall:
    path: .
targets:
  Landfall:
    type: application
    platform: macOS
    sources:
      - path: Sources/landfall
      - path: Resources/Landfall.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Landfall
        product: LandfallCore
    settings:
      base:
        PRODUCT_NAME: Landfall
        PRODUCT_BUNDLE_IDENTIFIER: com.heavystack.Landfall
        MARKETING_VERSION: ${LANDFALL_VERSION}
        CURRENT_PROJECT_VERSION: ${LANDFALL_BUILD}
        INFOPLIST_FILE: Resources/Info-MAS.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Landfall-MAS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4J2T5H73JM
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Landfall
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAS
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        DEAD_CODE_STRIPPING: YES
